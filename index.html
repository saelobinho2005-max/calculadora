<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
    }

    .calculator {
      width: 320px;
      background: #1f2937;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .display {
      width: 100%;
      height: 80px;
      background: #111827;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 2rem;
      text-align: right;
      padding: 0 16px;
      margin-bottom: 18px;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 60px;
      border: none;
      border-radius: 12px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
      background: #374151;
      color: white;
    }

    button:hover {
      opacity: 0.95;
    }

    button:active {
      transform: scale(0.98);
    }

    .operator {
      background: #f59e0b;
    }

    .clear {
      background: #ef4444;
    }

    .zero {
      grid-column: span 2;
    }

    .equal {
      background: #10b981;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input class="display" id="display" type="text" readonly />

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="appendValue('/')">/</button>
      <button class="operator" onclick="appendValue('*')">×</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('-')">−</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button class="equal" onclick="calculateResult()">=</button>

      <button class="zero" onclick="appendValue('0')">0</button>
      <button onclick="appendValue('.')">.</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendValue(value) {
      const current = display.value;

      // Prevent invalid leading operators like "*/+"
      if (current === '' && ['+', '-', '*', '/'].includes(value)) {
        return;
      }

      // Prevent multiple decimal points in same number
      const lastNumber = current.split(/[-+*/]/).pop();
      if (value === '.' && lastNumber.includes('.')) {
        return;
      }

      display.value += value;
    }

    function clearDisplay() {
      display.value = '';
    }

    function deleteLast() {
      display.value = display.value.slice(0, -1);
    }

    function calculateResult() {
      try {
        const result = Function(`"use strict"; return (${display.value})`)();
        display.value = Number.isFinite(result) ? result : 'Error';
      } catch {
        display.value = 'Error';
      }
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key;

      if (/^[0-9+\-*/.=]$/.test(key)) {
        if (key === '=') {
          calculateResult();
        } else {
          appendValue(key);
        }
      } else if (key === 'Enter') {
        calculateResult();
      } else if (key === 'Backspace') {
        deleteLast();
      } else if (key === 'Escape') {
        clearDisplay();
      }
    });
  </script>
</body>
  </html>
